# KEEP-ALIVE — Render free-tier anti-spin-down
# Pings /live (process-alive, deliberately dependency-free) every 10
# minutes so the free Render instance never idles out (the free tier
# sleeps a service after ~15 minutes without traffic; the next real
# visitor would pay a 30-60s cold start).
#
# NEON DRAIN FIX (2026-09-17): this workflow used to ping /health, which
# touches the database — resetting Neon's 5-minute idle timer every 10
# minutes and defeating scale-to-zero. That converts the free tier into
# always-on compute: 0.25 CU x ~720h ~= 180 compute-hours/month ~= the
# ENTIRE free allowance — the root cause (with heavy live testing) of the
# mid-month quota wall that took the database and the A.2 battery down.
# /live keeps Render warm without ever waking Neon; deep DB health is
# verified by the nightly shadow battery, which fails loudly if it's down.
#
# Replaces the in-chat cron automation (2026-09-15): keep-alive belongs in
# infrastructure, not a chat session — this survives without any agent and
# surfaces failures as red workflow runs.
# NOTE: GitHub disables scheduled workflows after 60 days of repo inactivity —
# regular commits (or the canary) keep this alive.

name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min; Render idles out at ~15
  workflow_dispatch: {}       # manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake Render (process liveness only — never the DB)
        run: |
          for attempt in 1 2; do
            code=$(curl -s -o /tmp/live.json -w "%{http_code}" \
                    --max-time 60 \
                    https://adaptive-rag-enterprise.onrender.com/live) || code="curl-failed"
            if [ "$code" = "200" ]; then
              echo "alive: $(cat /tmp/live.json | head -c 200)"
              exit 0
            fi
            echo "attempt $attempt got: $code"
            [ $attempt -lt 2 ] && sleep 30
          done
          echo "::error::Deployment down — /live returned $code after retry"
          exit 1

      # STREAMLIT COMMUNITY CLOUD SLEEP (added 2026-10-03): the public demo
      # showed recruiters a "Zzzz — this app has gone to sleep" screen. Free
      # Streamlit apps idle out, and a sleeping app is a worse first
      # impression than a slow one. Best-effort ping, PURELY advisory: any
      # non-200 is reported as a warning, never a failure, because
      # Streamlit's sleep behaviour is not a contract we control and a red
      # workflow here would be noise. The durable proof link remains
      # /verify/{run_id} on Render (no keys, no login, zero tokens).
      - name: Nudge Streamlit demo awake (best-effort, never fails the job)
        continue-on-error: true
        run: |
          body=$(curl -sL --max-time 90 -A "Mozilla/5.0 (keep-alive)" \
                  https://adaptive-rag-enterprise.streamlit.app) || body=""
          if printf '%s' "$body" | grep -qi "gone to sleep"; then
            echo "::warning::Streamlit demo is ASLEEP — wake it at https://adaptive-rag-enterprise.streamlit.app (one click)"
          else
            echo "Streamlit demo responded (not in the sleep state)."
          fi
