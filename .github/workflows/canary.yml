# CANARY — Nightly Drift Watcher (P2.2)
# Runs the 12-question coverage battery against Groq's fresh daily window
# (05:30 IST reset; 00:30 UTC is safely inside the new window). Separates
# CAPACITY refusals (quota 429s/TPD walls — expected sometimes, not a
# regression) from LOGIC drift (gate rejections, gold misses, audit
# anomalies — the real alarm). Pushes a coverage_report artifact every run.

name: canary

on:
  # A.2 GATE PRIORITY (2026-09-17): nightly schedule PAUSED. The canary's
  # 12-question battery drains the fresh Groq exec window (200K TPD/model)
  # ~40 minutes before the shadow battery needs it — the 09-17 run showed
  # the A.2 measurement starving on quota walls (13/22 covered questions
  # 429-aborted) because the canary consumed the window first. The A.2
  # gate is the current project milestone; its instrument (shadow_battery
  # .yml) gets the fresh window exclusively. RESTORE this cron after the
  # gate clears (7 green nights) or when non-Groq exec capacity lands.
  # schedule:
  #   - cron: "30 0 * * *"   # 00:30 UTC = 06:00 IST, right after Groq's daily reset
  workflow_dispatch: {}     # manual trigger for ad-hoc runs (still available)

jobs:
  coverage-battery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Failover chain assembled from present secrets (same pattern as
      # shadow_battery.yml — the static TokenRouter lane went dead when
      # z-ai/glm-5.3-free was retired upstream; assembly cannot ship a
      # dead lane). Canary schedule is PAUSED for the A.2 gate (see the
      # trigger comment above); this keeps manual dispatches correct.
      - name: Assemble failover chain from present secrets
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          APINEX_API_KEY: ${{ secrets.APINEX_API_KEY }}
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
        run: |
          python - <<'EOF'
          import json, os
          lanes = []
          # order = 2026-09-18 vetting evidence: APInex steady (10-67s),
          # NIM vetted, glm-5.2:free LAST (upstream shared-pool congestion
          # measured live: benchmark corpus runs refused at 443s/464s;
          # tamper 4/4 PASS but ADR-008 bar not met)
          if os.getenv("APINEX_API_KEY"):
              lanes.append({"base_url": "https://api.apinex.bond/v1",
                            "api_key_env": "APINEX_API_KEY",
                            "model": "free/gemini-3.8-flash",
                            "timeout_s": 120, "max_tokens": 4000})
          if os.getenv("NIM_API_KEY"):
              lanes.append({"base_url": "https://integrate.api.nvidia.com/v1",
                            "api_key_env": "NIM_API_KEY",
                            "model": "nvidia/nemotron-3-super-120b-a12b"})
          if os.getenv("OPENROUTER_API_KEY"):
              lanes.append({"base_url": "https://openrouter.ai/api/v1",
                            "api_key_env": "OPENROUTER_API_KEY",
                            "model": "z-ai/glm-5.2:free",
                            "timeout_s": 60, "max_tokens": 4000})
          assert lanes, ("no failover lanes available — add at least one "
                         "provider secret")
          chain = json.dumps(lanes, separators=(",", ":"))
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"RAG_FAILOVER_ENDPOINTS={chain}\n")
          print("assembled failover chain:", chain)
          EOF

      - name: Canary — 12-question coverage battery
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          APINEX_API_KEY: ${{ secrets.APINEX_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DB_DATABASE_URL: ${{ secrets.DB_DATABASE_URL }}
          DB_ADMIN_DATABASE_URL: ${{ secrets.DB_ADMIN_DATABASE_URL }}
          RAG_EXEC_PEER_FAILOVER: "1"
          RAG_DISABLE_CACHE_READ: "1"
          RAG_DISABLE_CACHE_WRITE: "1"
          COVERAGE_HINT_WAIT_CAP_S: "1200"
          # RAG_FAILOVER_ENDPOINTS assembled by the preflight step above.
          # Pruning + near-exact cache thresholds are default-on in code
          # since df5cca6/7037ccd — the battery measures the same pipeline
          # the live service runs.
        run: python scripts/coverage_eval.py --provider groq --report coverage_report_canary.json

      - name: Upload coverage report (every run, pass or fail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_id }}
          path: coverage_report_canary.json
          retention-days: 90

      - name: Classify result (drift vs capacity)
        if: always()
        run: python scripts/classify_canary.py coverage_report_canary.json
