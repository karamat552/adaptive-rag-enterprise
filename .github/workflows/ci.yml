# CI — Adaptive RAG Enterprise Platform
# (Repackaged from a stray `.github/workflows` *file* that GitHub Actions
#  could never execute — it must be a directory of *.yml files.)
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.lock
      - name: Unit tests — offline suite (live/integration excluded; Phase 0 isolation 2026-09-28)
        run: pytest tests --ignore=tests/test_answer_accuracy.py -m "not integration and not live" -v

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16   # Postgres 16 + pgvector + pg_trgm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ragdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.lock

      - name: Migrate schema + bootstrap least-privilege runtime role
        env:
          DB_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ragdb
          # Required by db.Settings (fail-closed) even though bootstrap only
          # CONNECTS as owner — this URL becomes valid once the role is created.
          DB_DATABASE_URL: postgresql://app_rag:ciruntimepw123@localhost:5432/ragdb
          APP_RAG_PASSWORD: ciruntimepw123
        run: python scripts/bootstrap_roles.py

      - name: Run full suite as the RLS-bound runtime role
        env:
          DB_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ragdb
          DB_DATABASE_URL: postgresql://app_rag:ciruntimepw123@localhost:5432/ragdb
        run: pytest tests/test_db.py -v

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      # The lock is fully pinned (pip-compile, all transitives), so
      # --no-deps audits exactly the frozen tree. Allowlisted IDs must
      # carry an inline reason in pip-audit-allowlist.txt (Phase 0).
      - name: Dependency vulnerability audit (Phase 0)
        run: >-
          ARGS=$(grep -v '^#' pip-audit-allowlist.txt | grep -v '^$'
          | awk '{print "--ignore-vuln " $1}' | tr '\n' ' ');
          pip-audit -r requirements.lock --no-deps $ARGS

  docker:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - name: Build production image (2-stage, non-root)
        run: docker build -t adaptive-rag:ci .
