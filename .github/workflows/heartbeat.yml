# HEARTBEAT — the DEEP health check, drain-bounded (the Neon-drain lesson).
#
# NEON-DRAIN LESSON (the keep-alive's documented root cause, 2026-09-17):
# /health and /ready both call the DB health check — polling them
# frequently wakes Neon, resets its 5-minute idle timer, defeats
# scale-to-zero, and converts the free tier into always-on compute
# (0.25 CU x ~720h ~= 180 compute-hours/month ~= the ENTIRE free
# allowance) — the root cause of the September mid-month quota wall that
# took the database and the A.2 battery down.
#
# DIVISION OF LABOR (fixed 2026-10-10 — the first version of this file
# polled /health + /ready + /metrics every 15 min and had that exact
# bug):
#   keep_alive.yml — /live every 10 min: Render-warm, dependency-free,
#     NEVER wakes Neon; the PROCESS-down detector (fails loudly).
#   heartbeat.yml (this file) — /health every 6 HOURS: the DEEP check
#     (DB reachability, resolved per-stage models, boot-smoke verdict,
#     llm_circuit). Four wakes/day cost ~20 min of Neon compute (~2.5
#     compute-hours/month — negligible against the 180h allowance) and
#     bound the DB-outage detection latency to 6 hours.
#
# What a /health failure means: the API is up but the database or a
# model lane is degraded — check the service logs; the keep-alive's
# green run proves the process itself is alive.

name: heartbeat

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}     # manual trigger for ad-hoc deep checks

jobs:
  deep-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deep /health check
        run: |
          set -e
          BASE="https://adaptive-rag-enterprise.onrender.com"
          H=$(curl -sf --max-time 60 "$BASE/health") || {
            echo "::error::/health failed — the API is up but degraded, or down"
            exit 1
          }
          echo "$H"
          echo "$H" | python3 -c "
          import json, sys
          h = json.load(sys.stdin)
          db = h.get('db') or {}
          print('db status  :', db.get('status'))
          print('graph      :', h.get('graph'), '| llm_circuit:',
                h.get('llm_circuit'), '| circuit_failures:',
                h.get('circuit_failures'))
          print('models     :', h.get('models'))
          print('boot_smoke :', h.get('boot_smoke'))
          failed = []
          if db.get('status') != 'reachable':
              failed.append('db unreachable')
          if h.get('llm_circuit') == 'open':
              failed.append('llm_circuit OPEN — the circuit breaker tripped')
          if failed:
              for f in failed:
                  print('::error::' + f)
              sys.exit(1)
          "
