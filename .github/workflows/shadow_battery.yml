# SHADOW BATTERY — ADR-017 Phase-1 A.2 gate instrument (nightly)
# The Phase-1 exit gate needs 7 consecutive GREEN nights: >=98% V1-vs-V2
# agreement on covered questions, 15/15 corrupted-claim catches, zero
# fabrications. This workflow runs the pre-registered 42-question battery:
#   1. deterministic routing matrix (zero tokens, 42/42 required)
#   2. corrupted-claim gate X01-X15 (zero tokens, 15/15 required)
#   3. live shadow pass — full V1 pipeline per question, ledger per run
# Capacity shortfalls (quota walls on every failover lane) mark the night
# INCOMPLETE (exit 2): the green-nights clock does not advance and is not
# falsely reset — the same capacity-vs-logic discipline as the canary.
name: shadow-battery

on:
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC — same fresh Groq window as the canary
  workflow_dispatch: {}     # manual trigger (ad-hoc A.2 measurement)

jobs:
  a2-battery:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ASSEMBLE the failover chain from whichever lane secrets are
      # present — a missing secret can never poison the battery with a
      # dead/empty-key lane (the TokenRouter lesson: its free model was
      # retired upstream overnight and the static lane went dead).
      # Lane order = probe results 2026-09-17: union-alpha (3.6-12s,
      # strict-JSON + [n]-citation clean) -> APInex gemini free (10-67s)
      # -> NIM. Executive stage stays PINNED (ADR-008); these are
      # router+fleet lanes only.
      - name: Assemble failover chain from present secrets
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          APINEX_API_KEY: ${{ secrets.APINEX_API_KEY }}
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
        run: |
          python - <<'EOF'
          import json, os
          lanes = []
          if os.getenv("OPENROUTER_API_KEY"):
              lanes.append({"base_url": "https://openrouter.ai/api/v1",
                            "api_key_env": "OPENROUTER_API_KEY",
                            "model": "stealth/union-alpha",
                            "timeout_s": 60, "max_tokens": 4000})
          if os.getenv("APINEX_API_KEY"):
              lanes.append({"base_url": "https://api.apinex.bond/v1",
                            "api_key_env": "APINEX_API_KEY",
                            "model": "free/gemini-3.8-flash",
                            "timeout_s": 120, "max_tokens": 4000})
          if os.getenv("NIM_API_KEY"):
              lanes.append({"base_url": "https://integrate.api.nvidia.com/v1",
                            "api_key_env": "NIM_API_KEY",
                            "model": "nvidia/nemotron-3-super-120b-a12b"})
          assert lanes, ("no failover lanes available — add at least one "
                         "of OPENROUTER_API_KEY / APINEX_API_KEY / NIM_API_KEY "
                         "as a repository secret")
          chain = json.dumps(lanes, separators=(",", ":"))
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"RAG_FAILOVER_ENDPOINTS={chain}\n")
          print("assembled failover chain:", chain)
          EOF

      - name: A.2 battery — matrix + corrupted + shadow
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          APINEX_API_KEY: ${{ secrets.APINEX_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DB_DATABASE_URL: ${{ secrets.DB_DATABASE_URL }}
          DB_ADMIN_DATABASE_URL: ${{ secrets.DB_ADMIN_DATABASE_URL }}
          RAG_EXEC_PEER_FAILOVER: "1"
          # Fresh measurement, like the canary: no cache replays — every
          # question pays the full pipeline so agreement is measured, not
          # replayed. Shadow ledger rows are keyed by run_id (never deduped).
          RAG_DISABLE_CACHE_READ: "1"
          RAG_DISABLE_CACHE_WRITE: "1"
          COVERAGE_HINT_WAIT_CAP_S: "1200"
          # RAG_FAILOVER_ENDPOINTS is assembled by the preflight step
          # above (GITHUB_ENV) — only lanes with present secrets run.
        run: |
          python scripts/battery_phase1.py --shadow --corrupted \
            --report shadow_battery_report.json

      - name: Upload A.2 report (every run, pass or fail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-battery-${{ github.run_id }}
          path: shadow_battery_report.json
          retention-days: 90
